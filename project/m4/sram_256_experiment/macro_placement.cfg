# 16 macros: 8 banks × 2 rows, reshaped as 4 cols × 4 rows.
# Each macro: 479.78 × 397.5 µm. Column pitch: 529.78 (+ 50 µm gap).
# Row pitch: 497.5 µm (+ 100 µm gap for routing channel).
#
# 4-wide layout: 4 × 529.78 = 2119 µm — leaves ~2881 µm for compute/routing.
# 4 rows tall: 4 × 497.5 = 1990 µm — compute logic above y=2100.
#
# Bank mapping: banks 0-3 in left 2 cols, banks 4-7 in right 2 cols.
# Row mapping: rows 0-1 in bottom 2 rows, rows 0-1 in top 2 rows (same row_sel).
# NOTE: This remaps the generate indices — RTL must match (see top_sram256.sv).
#
# Simple approach: treat it as 4 physical columns, each column = 2 banks stacked.

