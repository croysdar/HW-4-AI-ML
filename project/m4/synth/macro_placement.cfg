# Macro placement — 4 SRAM macros, 1 row × 4 columns.
# Format: <instance_name> <x_um> <y_um> <orientation>
#
# 4 × sky130_sram_1kbyte_1rw1r_32x256_8 (479.78 × 397.5 µm).
#
# Layout: 4 columns at x = 100, 650, 1200, 1750 (550 µm pitch, 70 µm gap).
# Single row at y = 200 (clears PDN horizontal stripe at y≈100-200).
# Macros occupy x: 100..2229.78, y: 200..597.5.
# All standard-cell compute logic fills upper die area above y=650.
#
# Single row eliminates the inter-row PDN met4 stripe DRC issue that
# affected the 8-macro design (met4 stripe at y≈750 was unavoidable
# with two rows of macros). Expected DRC = 0.
#
# Macro i maps gen_banks[i].u_bank (banks 0-3 left-to-right).

# ── Single row (banks 0–3, y=200) ─────────────────────────────────────────────
gen_banks[0].u_bank    100.00   200.00  N
gen_banks[1].u_bank    650.00   200.00  N
gen_banks[2].u_bank   1200.00   200.00  N
gen_banks[3].u_bank   1750.00   200.00  N
