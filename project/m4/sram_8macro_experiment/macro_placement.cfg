# Macro placement — 8 SRAM macros, 2 rows × 4 columns.
# Format: <instance_name> <x_um> <y_um> <orientation>
#
# 8 × sky130_sram_1kbyte_1rw1r_32x256_8 (479.78 × 397.5 µm).
#
# Layout: 4 columns at x = 100, 650, 1200, 1750 (550 µm pitch, 70 µm gap).
# Row 0 (banks 0-3): y = 200.  Row 1 (banks 4-7): y = 850 (252.5 µm gap).
# Macros occupy x: 100..2229.78, y: 200..1247.5.
# Remaining die area above y=1300 used for standard-cell compute logic.
# y=850 (not 750) chosen to clear the PDN met4 horizontal stripe that runs
# through the inter-row gap — at y=750 it caused 14 metal-spacing DRC errors.
#
# Macro i maps gen_banks[i].u_bank:
#   Banks 0-3: bottom row (y=200), left-to-right.
#   Banks 4-7: top row    (y=750), left-to-right.
#
# y=200 chosen (not 100) to clear the PDN horizontal stripe at y≈100-200 —
# same fix that resolved met4 collisions in the 1-macro experiment.

# ── Bottom row (banks 0–3, y=200) ────────────────────────────────────────────
gen_banks[0].u_bank    100.00   200.00  N
gen_banks[1].u_bank    650.00   200.00  N
gen_banks[2].u_bank   1200.00   200.00  N
gen_banks[3].u_bank   1750.00   200.00  N

# ── Top row (banks 4–7, y=850) ────────────────────────────────────────────────
gen_banks[4].u_bank    100.00   850.00  N
gen_banks[5].u_bank    650.00   850.00  N
gen_banks[6].u_bank   1200.00   850.00  N
gen_banks[7].u_bank   1750.00   850.00  N
