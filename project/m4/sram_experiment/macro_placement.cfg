# Macro placement for Option 5 experiment
# Format: <instance_name> <x_um> <y_um> <orientation>
# Orientation: N (R0), S (R180), FN (MY), FS (MX), W (R90), E (R270), FW, FE
#
# Layout: 4×2 grid in lower-left quadrant of 3600×3600 die.
# SRAM macros: 683.1 × 416.54 µm each, with 50 µm spacing for routing channels.
# Compute logic placed in the upper region (y > ~1000 µm).
#
# The 50 µm halos between macros give the global router space to traverse
# the array horizontally on met3+ without fighting full-die obstructions.

# NOTE on instance names: SystemVerilog generate-block instances use bracketed
# names in the netlist (e.g., g_sram_bank[0].u_bank). OpenLane 2's
# Odb.ManualMacroPlacement matches via OpenDB find_inst which accepts the
# bracketed form directly. If the run fails with "instance not found", check
# the synthesized netlist (or 06-yosys-synthesis/*.nl.v) for the actual
# hierarchical name yosys produced and adjust.

g_sram_bank[0].u_bank   100.00   100.00  N
g_sram_bank[1].u_bank   833.10   100.00  N
g_sram_bank[2].u_bank  1566.20   100.00  N
g_sram_bank[3].u_bank  2299.30   100.00  N
g_sram_bank[4].u_bank   100.00   566.54  N
g_sram_bank[5].u_bank   833.10   566.54  N
g_sram_bank[6].u_bank  1566.20   566.54  N
g_sram_bank[7].u_bank  2299.30   566.54  N
